<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLiNER Pong</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='3' width='2' height='7' fill='%237ee787'/%3E%3Crect x='12' y='6' width='2' height='7' fill='%23f0883e'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='%23e6edf3'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161b;
    --line: #232a33;
    --text: #e6edf3;
    --muted: #8b97a5;
    --left: #7ee787;
    --right: #f0883e;
    --accent: #58a6ff;
    --bad: #ff7b72;
    --side: 240px;      /* width of each player card */
    --chrome: 150px;    /* vertical space around the court: title, score row, help row, padding */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }

  /* Layout: title on top, then player card | court | player card. */
  .layout {
    min-height: 100%; padding: 12px 16px 20px;
    display: grid; gap: 12px 16px; align-content: start;
    grid-template-columns: minmax(0, 1fr);
  }
  h1 { grid-column: 1 / -1; margin: 0; font-size: clamp(18px, 3vw, 24px); font-weight: 700; letter-spacing: .02em; text-align: center; }
  h1 .left { color: var(--left); }
  h1 .right { color: var(--right); }
  h1 .vs { color: var(--muted); font-weight: 400; padding: 0 .3em; }
  .center { order: -1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

  @media (min-width: 900px) and (min-height: 560px) {
    body { overflow: hidden; }
    .layout {
      height: 100dvh; min-height: 0; padding: 12px 16px; align-content: stretch;
      grid-template-columns: minmax(200px, var(--side)) minmax(0, 1fr) minmax(200px, var(--side));
      grid-template-rows: auto minmax(0, 1fr);
    }
    .center { order: 0; justify-content: center; }
    .card { overflow-y: auto; }   /* only if the window is very small */
  }

  .banner { background: #2a1517; border: 1px solid var(--bad); color: var(--bad); border-radius: 6px; padding: 8px 12px; }
  .banner[hidden] { display: none; }

  .board { width: 100%; margin: 0 auto; }
  @media (min-width: 900px) and (min-height: 560px) {
    .board { width: min(100%, calc((100dvh - var(--chrome)) * 1.6)); }
  }
  .board canvas { background: #000; border: 1px solid var(--line); border-radius: 6px; width: 100%; height: auto; display: block; }
  .board .score, .board .bar-row { margin: 0; }
  .score { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .score > div { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .score .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score b { font-size: 28px; line-height: 1; }
  .score .left b { color: var(--left); }
  .score .right { flex-direction: row-reverse; }
  .score .right b { color: var(--right); }
  .bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .help { color: var(--muted); font-size: 12px; }
  .buttons { display: flex; gap: 8px; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card.left .pick .label { color: var(--left); }
  .card.right .pick .label { color: var(--right); }
  select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font: inherit; cursor: pointer; text-overflow: ellipsis;
  }
  select:disabled { opacity: .5; cursor: not-allowed; }
  .body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .body h2 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .card.left h2 { color: var(--left); }
  .card.right h2 { color: var(--right); }
  .idea { font-size: 11px; color: var(--muted); max-height: 5.6em; overflow-y: auto; }
  .text { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-height: 3.6em; overflow-wrap: anywhere; }
  .choices { display: flex; gap: 6px; }
  .choice { flex: 1; text-align: center; padding: 6px 2px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .card.left .choice.on { background: var(--left); border-color: var(--left); color: #000; font-weight: 700; }
  .card.right .choice.on { background: var(--right); border-color: var(--right); color: #000; font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .1s; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat b { font-size: 18px; display: block; line-height: 1.2; overflow-wrap: anywhere; }
  .stat small { color: var(--muted); font-size: 11px; }
  .status { font-size: 11px; color: var(--muted); }
  .status.err { color: var(--bad); }
  .you-body p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main class="layout">
  <h1 id="title">Pong</h1>

  <section class="card left" id="cardLeft">
    <div class="pick">
      <label class="label" for="selLeft">Left player</label>
      <select id="selLeft" disabled><option>Loading…</option></select>
    </div>
    <div class="body" id="bodyLeft"></div>
  </section>

  <section class="center">
    <div class="banner" id="banner" role="alert" hidden></div>
    <div class="board">
      <div class="score">
        <div class="left"><b id="scoreLeft">0</b><span class="name" id="nameLeft">…</span></div>
        <div class="right"><b id="scoreRight">0</b><span class="name" id="nameRight">…</span></div>
      </div>
      <canvas id="c" width="800" height="500"></canvas>
      <div class="bar-row">
        <div class="help" id="help"></div>
        <div class="buttons">
          <button id="btnServe" type="button">Serve</button>
          <button id="btnReset" type="button">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card right" id="cardRight">
    <div class="pick">
      <label class="label" for="selRight">Right player</label>
      <select id="selRight" disabled><option>Loading…</option></select>
    </div>
    <div class="body" id="bodyRight"></div>
  </section>
</main>

<template id="aiCard">
  <h2 class="who"></h2>
  <div class="idea"></div>
  <div>
    <div class="label">What the model reads</div>
    <div class="text">Press Space to serve.</div>
  </div>
  <div>
    <div class="label">What it decides</div>
    <div class="choices">
      <div class="choice" data-a="up">▲ up</div>
      <div class="choice" data-a="stay">■ stay</div>
      <div class="choice" data-a="down">▼ down</div>
    </div>
  </div>
  <div>
    <div class="label">Confidence <span class="conf"></span></div>
    <div class="bar"><i></i></div>
  </div>
  <div class="stats">
    <div class="stat"><b class="lat">–</b><small>latency (ms)</small></div>
    <div class="stat"><b class="rate">–</b><small>decisions / sec</small></div>
    <div class="stat"><b class="picked">–</b><small>label it picked</small></div>
    <div class="stat"><b class="count">0</b><small>decisions</small></div>
  </div>
  <div class="status" role="status">Connecting to model…</div>
</template>

<template id="youCard">
  <h2>You</h2>
  <p><kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd> to move your paddle.</p>
</template>

<script>
const W = 800, H = 500;
const PADDLE_W = 12, PADDLE_H = 90, MARGIN = 20;
const PADDLE_SPEED = 420, BALL_START = 360, BALL_R = 8;
const COLORS = { left: "#7ee787", right: "#f0883e" };
let BALL_MAX = 820; // the server sends the season 1 cap

const $ = (id) => document.getElementById(id);
const ctx = $("c").getContext("2d");
const YOU = "you";

// sign matches the server: -1 is the left paddle, 1 is the right one.
function newSide(name, sign) {
  return { name, sign, who: YOU, y: H / 2, dir: 0, score: 0, epoch: 0, inFlight: false, retryAt: 0, stats: { n: 0, ms: [] }, stamps: [], el: null };
}
const sides = { left: newSide("left", -1), right: newSide("right", 1) };
const other = (s) => (s === sides.left ? sides.right : sides.left);
const isAI = (s) => s.who !== YOU;

let players = {};    // harness id -> { id, name, idea, tags }
let defaultPlayer = null;
let ball, running = false;
const keys = {};

function resetBall(toward) {
  const angle = Math.random() * 0.8 - 0.4;
  const dir = toward ?? (Math.random() < 0.5 ? -1 : 1);
  ball = { x: W / 2, y: H / 2, vx: Math.cos(angle) * BALL_START * dir, vy: Math.sin(angle) * BALL_START };
}
resetBall();

const playerName = (who) => (who === YOU ? "You" : who);
const fullName = (who) => (who === YOU ? "You" : `${who} · ${players[who]?.name ?? ""}`);

// ---------------------------------------------------------------- model calls

async function decide(s) {
  const opp = other(s);
  const epoch = s.epoch;
  s.inFlight = true;
  try {
    const res = await fetch("/decide", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        player: s.who, side: s.sign,
        ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy },
        myY: s.y, oppY: opp.y, scoreMe: s.score, scoreOpp: opp.score, ballMax: BALL_MAX,
      }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.status);
    if (epoch !== s.epoch) return; // the match was reset or the player changed while waiting
    s.dir = d.action === "up" ? -1 : d.action === "down" ? 1 : 0;
    render(s, d);
    setStatus(s, "Model connected.");
  } catch (e) {
    if (epoch !== s.epoch) return;
    s.dir = 0;
    s.retryAt = performance.now() + 1000;
    setStatus(s, `Model error: ${e.message}. Is the server running?`, true);
  } finally {
    if (epoch === s.epoch) s.inFlight = false;
  }
}

function think() {
  if (!running) return;
  for (const s of Object.values(sides)) {
    if (isAI(s) && !s.inFlight && performance.now() >= s.retryAt) decide(s);
  }
}

function setStatus(s, msg, err = false) {
  if (!s.el) return;
  s.el.status.textContent = msg;
  s.el.status.className = err ? "status err" : "status";
}

function render(s, d) {
  const st = s.stats, el = s.el;
  st.n++;
  st.ms.push(d.ms); if (st.ms.length > 30) st.ms.shift();
  const now = performance.now();
  s.stamps.push(now); s.stamps = s.stamps.filter((t) => now - t < 2000);

  el.text.textContent = d.text;
  el.choices.forEach((c) => c.classList.toggle("on", c.dataset.a === d.action));
  el.conf.textContent = `${(d.confidence * 100).toFixed(0)}%`;
  el.bar.style.width = `${d.confidence * 100}%`;
  el.lat.textContent = Math.round(st.ms.reduce((a, b) => a + b, 0) / st.ms.length);
  el.rate.textContent = (s.stamps.length / 2).toFixed(1);
  el.picked.textContent = d.label;
  el.count.textContent = st.n;
}

// ---------------------------------------------------------------- game

function step(dt) {
  const up = keys["w"] || keys["arrowup"], down = keys["s"] || keys["arrowdown"];
  for (const s of Object.values(sides)) {
    if (!isAI(s)) s.y += ((down ? 1 : 0) - (up ? 1 : 0)) * PADDLE_SPEED * dt;
    // An AI paddle keeps its last decision until the next one arrives.
    else if (running) s.y += s.dir * PADDLE_SPEED * dt;
    s.y = Math.max(PADDLE_H / 2, Math.min(H - PADDLE_H / 2, s.y));
  }

  if (!running) return;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy *= -1; }
  if (ball.y > H - BALL_R) { ball.y = H - BALL_R; ball.vy *= -1; }

  hit(sides.left, MARGIN + PADDLE_W, 1);
  hit(sides.right, W - MARGIN - PADDLE_W, -1);

  if (ball.x < -20) point(sides.right);
  else if (ball.x > W + 20) point(sides.left);
}

function hit(p, faceX, dir) {
  const movingIn = dir === 1 ? ball.vx < 0 : ball.vx > 0;
  const atFace = dir === 1 ? ball.x - BALL_R <= faceX && ball.x > faceX - PADDLE_W
                           : ball.x + BALL_R >= faceX && ball.x < faceX + PADDLE_W;
  if (movingIn && atFace && Math.abs(ball.y - p.y) <= PADDLE_H / 2 + BALL_R) {
    const off = (ball.y - p.y) / (PADDLE_H / 2); // -1..1, where on the paddle it hit
    const speed = Math.min(BALL_MAX, Math.hypot(ball.vx, ball.vy) * 1.05);
    const angle = off * 0.9;
    ball.vx = Math.cos(angle) * speed * dir;
    ball.vy = Math.sin(angle) * speed;
    ball.x = faceX + BALL_R * dir;
  }
}

function point(scorer) {
  scorer.score++;
  showScores();
  setRunning(false);
  resetBall(scorer === sides.left ? 1 : -1); // serve toward the player who lost the point, like arena.py
  for (const s of Object.values(sides)) if (s.el?.text) s.el.text.textContent = "Point! Press Space to serve.";
}

function setRunning(v) {
  running = v;
  if (!v) for (const s of Object.values(sides)) s.dir = 0;
  $("btnServe").textContent = v ? "Pause" : "Serve";
}

function showScores() {
  $("scoreLeft").textContent = sides.left.score;
  $("scoreRight").textContent = sides.right.score;
}

function newMatch() {
  setRunning(false);
  resetBall();
  for (const s of Object.values(sides)) {
    s.score = 0; s.y = H / 2; s.dir = 0;
    s.epoch++; s.inFlight = false; s.retryAt = 0;
    s.stats = { n: 0, ms: [] }; s.stamps = [];
  }
  showScores();
  buildCards();
}

function draw() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#232a33"; ctx.setLineDash([8, 10]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = COLORS.left; ctx.fillRect(MARGIN, sides.left.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
  ctx.fillStyle = COLORS.right; ctx.fillRect(W - MARGIN - PADDLE_W, sides.right.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
  ctx.fillStyle = "#e6edf3"; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();

  if (!running) {
    ctx.fillStyle = "#8b97a5"; ctx.font = "16px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
    ctx.fillText("SPACE to serve", W / 2, H / 2 - 30);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt); think(); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- input

addEventListener("keydown", (e) => {
  if (e.target.closest?.("select, button")) return;
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  if (k === " " && !e.repeat) setRunning(!running);
  if (k === "r" && !e.repeat) newMatch();
  keys[k] = true;
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

$("btnServe").addEventListener("click", (e) => { setRunning(!running); e.target.blur(); });
$("btnReset").addEventListener("click", (e) => { newMatch(); e.target.blur(); });

// ---------------------------------------------------------------- players and cards

function buildCards() {
  for (const s of Object.values(sides)) {
    const host = $(s.name === "left" ? "bodyLeft" : "bodyRight");
    host.replaceChildren();
    host.classList.toggle("you-body", !isAI(s));
    if (isAI(s)) {
      host.append($("aiCard").content.cloneNode(true));
      const q = (sel) => host.querySelector(sel);
      q(".who").textContent = fullName(s.who);
      q(".idea").textContent = players[s.who]?.idea ?? "";
      s.el = {
        text: q(".text"), choices: [...host.querySelectorAll(".choice")], conf: q(".conf"), bar: q(".bar i"),
        lat: q(".lat"), rate: q(".rate"), picked: q(".picked"), count: q(".count"), status: q(".status"),
      };
      if (Object.keys(players).length) setStatus(s, "Model connected. Press Space to serve.");
    } else {
      host.append($("youCard").content.cloneNode(true));
      s.el = null;
    }
  }
}

function refreshLabels() {
  const [l, r] = [sides.left, sides.right];
  const title = $("title");
  title.replaceChildren();
  const span = (cls, text) => { const e = document.createElement("span"); e.className = cls; e.textContent = text; return e; };
  title.append("Pong: ", span("left", playerName(l.who)), span("vs", "VS"), span("right", playerName(r.who)));
  $("nameLeft").textContent = fullName(l.who);
  $("nameRight").textContent = fullName(r.who);
  const human = [l, r].some((s) => !isAI(s));
  $("help").innerHTML = (human ? "<kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd> move &nbsp;·&nbsp; " : "") +
    "<kbd>Space</kbd> serve / pause &nbsp;·&nbsp; <kbd>R</kbd> reset";
}

// Two humans are not supported: if you pick "You" on one side, the other side gets an AI.
function setPlayers(left, right, changed) {
  if (left === YOU && right === YOU) {
    const ai = Object.keys(players)[0];
    if (changed === "left") right = ai; else left = ai;
  }
  sides.left.who = left;
  sides.right.who = right;
  $("selLeft").value = left;
  $("selRight").value = right;
  try { localStorage.setItem("pong-players", JSON.stringify({ left, right })); } catch (e) {}
  newMatch();
  refreshLabels();
}

function fillSelect(sel) {
  sel.replaceChildren();
  const you = document.createElement("option");
  you.value = YOU; you.textContent = "You";
  sel.append(you);
  for (const p of Object.values(players)) {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = `${p.id} · ${p.name}${p.tags.length ? ` (${p.tags.join(", ")})` : ""}`;
    sel.append(opt);
  }
  sel.disabled = false;
}

for (const name of ["left", "right"]) {
  const sel = $(name === "left" ? "selLeft" : "selRight");
  sel.addEventListener("change", () => {
    setPlayers($("selLeft").value, $("selRight").value, name);
    sel.blur();
  });
}

function showBanner(msg) {
  $("banner").textContent = msg;
  $("banner").hidden = false;
}

async function init() {
  try {
    const res = await fetch("/players");
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    if (!d.players.length) throw new Error("no players found in players/");
    BALL_MAX = d.ballMax;
    defaultPlayer = d.default;
    for (const p of d.players) players[p.id] = p;
  } catch (e) {
    showBanner(`Could not load the players (${e.message}). Start the server with "uv run pong_server.py" and open the page it prints.`);
    $("selLeft").innerHTML = $("selRight").innerHTML = "<option>Unavailable</option>";
    refreshLabels();
    return;
  }
  fillSelect($("selLeft"));
  fillSelect($("selRight"));
  let left = YOU, right = players[defaultPlayer] ? defaultPlayer : Object.keys(players)[0];
  try {
    const saved = JSON.parse(localStorage.getItem("pong-players"));
    const ok = (v) => v === YOU || players[v];
    if (saved && ok(saved.left) && ok(saved.right)) { left = saved.left; right = saved.right; }
  } catch (e) {}
  setPlayers(left, right, "right");
}
init();
</script>
</body>
</html>
